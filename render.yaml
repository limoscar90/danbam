# Render Blueprint: https://dashboard.render.com/blueprints 에서 "New Blueprint Instance"로
# 이 저장소를 연결하면 아래 설정대로 서비스가 만들어진다.
#
# 회원 데이터는 Supabase(Postgres)에 저장되므로 Render 쪽에 디스크가 필요 없다 — Free 플랜으로
# 시작해도 재배포/재시작에 데이터가 사라지지 않는다. 다만 Free 플랜은 15분 정도 요청이 없으면
# 서비스가 잠들고, 다음 요청에서 깨어나는 데 수십 초가 걸린다(Playwright 브라우저까지 띄워야 해서
# 첫 요청은 특히 느릴 수 있음) — 계속 빠르게 응답해야 하면 Starter로 올리는 걸 권장.
services:
  - type: web
    name: danbamcamp
    runtime: docker
    plan: free
    envVars:
      - key: SESSION_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: ENABLE_AUTH
        value: true
      - key: DATABASE_URL
        sync: false # Supabase 연결 문자열은 비밀값이라 Render 대시보드에서 직접 입력해야 한다.
      - key: NCP_MAPS_CLIENT_ID
        sync: false # 네이버클라우드플랫폼 Maps Application의 Client ID/Secret도 마찬가지.
      - key: NCP_MAPS_CLIENT_SECRET
        sync: false
