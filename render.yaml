# Render Blueprint: https://dashboard.render.com/blueprints 에서 "New Blueprint Instance"로
# 이 저장소를 연결하면 아래 설정대로 서비스가 만들어진다.
#
# 주의: 회원 정보(data/users.json)를 담을 디스크는 Starter 이상 유료 플랜에서만 붙일 수 있다.
# Free 플랜으로 시작하면 disk 섹션이 무시되고, 재배포/재시작마다 가입자 목록이 초기화된다
# (테스트 단계에선 괜찮지만, 실제로 다른 사람이 계속 쓰게 하려면 Starter로 올리는 걸 권장).
services:
  - type: web
    name: danbamcamp
    runtime: docker
    plan: starter
    envVars:
      - key: SESSION_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: ENABLE_AUTH
        value: true
    disk:
      name: danbam-data
      mountPath: /app/data
      sizeGB: 1
