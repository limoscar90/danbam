app = 'danbamcamp'
primary_region = 'nrt'

[build]

[env]
  NODE_ENV = 'production'
  ENABLE_AUTH = 'true'

[http_service]
  internal_port = 5173
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
