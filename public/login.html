<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DANBAM 로그인</title>
<link rel="icon" href="logo.png" />
<link rel="stylesheet" href="style.css" />
</head>
<body class="auth-body">
  <div class="auth-card">
    <h1><img src="logo.png" alt="DANBAM" class="logo-icon" /> DANBAM</h1>
    <p class="sub">로그인하고 캠핑장 통합검색을 이용하세요</p>
    <form id="loginForm">
      <div class="field">
        <label for="email">이메일</label>
        <input id="email" name="email" type="email" required autocomplete="email" />
      </div>
      <div class="field">
        <label for="password">비밀번호</label>
        <input id="password" name="password" type="password" required autocomplete="current-password" />
      </div>
      <div id="authError" class="auth-error"></div>
      <button type="submit" class="btn-primary auth-submit">로그인</button>
    </form>
    <p class="auth-switch">계정이 없으신가요? <a href="/signup">회원가입</a></p>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const errorEl = document.getElementById('authError');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.textContent = '';
      const body = Object.fromEntries(new FormData(form));
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || '로그인에 실패했습니다.');
        window.location.href = '/';
      } catch (err) {
        errorEl.textContent = err.message;
      }
    });
  </script>
</body>
</html>
