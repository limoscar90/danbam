<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DANBAM 회원가입</title>
<link rel="icon" href="logo.png" />
<link rel="stylesheet" href="style.css" />
</head>
<body class="auth-body">
  <div class="auth-card">
    <h1><img src="logo.png" alt="DANBAM" class="logo-icon" /> DANBAM</h1>
    <p class="sub">이메일로 가입하고 캠핑장 통합검색을 이용하세요</p>
    <form id="signupForm">
      <div class="field">
        <label for="email">이메일</label>
        <input id="email" name="email" type="email" required autocomplete="email" />
      </div>
      <div class="field">
        <label for="password">비밀번호</label>
        <input id="password" name="password" type="password" required minlength="8" autocomplete="new-password" />
        <span class="field-hint">8자 이상</span>
      </div>
      <div class="field">
        <label for="passwordConfirm">비밀번호 확인</label>
        <input id="passwordConfirm" name="passwordConfirm" type="password" required minlength="8" autocomplete="new-password" />
      </div>
      <div id="authError" class="auth-error"></div>
      <button type="submit" class="btn-primary auth-submit">회원가입</button>
    </form>
    <p class="auth-switch">이미 계정이 있으신가요? <a href="/login">로그인</a></p>
  </div>

  <script>
    const form = document.getElementById('signupForm');
    const errorEl = document.getElementById('authError');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.textContent = '';
      const { email, password, passwordConfirm } = Object.fromEntries(new FormData(form));
      if (password !== passwordConfirm) {
        errorEl.textContent = '비밀번호가 일치하지 않습니다.';
        return;
      }
      try {
        const res = await fetch('/api/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || '회원가입에 실패했습니다.');
        window.location.href = '/';
      } catch (err) {
        errorEl.textContent = err.message;
      }
    });
  </script>
</body>
</html>
